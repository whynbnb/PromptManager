name: PromptManager
options:
  minimumXcodeGenVersion: 2.38.0
  developmentLanguage: zh-Hans
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
targets:
  PromptManager:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/PromptManager
      - path: PromptManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.whynbnb.PromptManager
        PRODUCT_NAME: Prompt Manager
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PromptManager/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 1.2
    scheme:
      testTargets: []
